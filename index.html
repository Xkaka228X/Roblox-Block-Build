<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🧱 Roblox Block Builder</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1a1a2e;--panel:#16213e;--sidebar:#0f3460;
  --cat-ui:#e94560;--cat-look:#f5a623;--cat-sound:#7ed321;
  --cat-event:#4a90e2;--cat-control:#9b59b6;--cat-vars:#27ae60;
  --cat-math:#e67e22;--cat-text:#1abc9c;--cat-roblox:#e74c3c;
  --cat-player:#3498db;--cat-loop:#8e44ad;--cat-logic:#f39c12;
  --snap:#00ff88;--text:#fff;--dim:#8892b0;
  --shadow:0 8px 32px rgba(0,0,0,.5);
}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;
  height:100dvh;display:flex;flex-direction:column;overflow:hidden;font-weight:700}

/* ── TOPBAR ── */
#topbar{
  height:56px;background:linear-gradient(135deg,#0f3460,#16213e);
  border-bottom:3px solid #e94560;display:flex;align-items:center;
  padding:0 12px;gap:10px;flex-shrink:0;z-index:200;
  box-shadow:0 4px 20px rgba(233,69,96,.3)
}
.logo{font-family:'Fredoka One',cursive;font-size:22px;color:#e94560;
  text-shadow:0 0 20px rgba(233,69,96,.5);white-space:nowrap}
.logo span{color:#f5a623}
#topbar-btns{display:flex;gap:8px;margin-left:auto;align-items:center}
.tbtn{
  padding:8px 16px;border-radius:20px;border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:13px;
  transition:.15s;display:flex;align-items:center;gap:6px
}
.tbtn-run{background:#27ae60;color:#fff;box-shadow:0 4px 15px rgba(39,174,96,.4)}
.tbtn-run:hover{background:#2ecc71;transform:scale(1.05)}
.tbtn-copy{background:#3498db;color:#fff}
.tbtn-copy:hover{background:#5dade2}
.tbtn-clear{background:#e74c3c;color:#fff}
.tbtn-clear:hover{background:#ec7063}
.tbtn-undo{background:#7f8c8d;color:#fff}
.block-count{
  background:rgba(255,255,255,.1);padding:6px 12px;border-radius:12px;
  font-size:12px;color:#aaa
}

/* ── LAYOUT ── */
#main{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
#sidebar{
  width:260px;min-width:260px;background:var(--panel);
  border-right:2px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;overflow:hidden;z-index:100
}
#cat-tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;
  padding:8px;background:rgba(0,0,0,.3);border-bottom:2px solid rgba(255,255,255,.05)
}
.cat-btn{
  padding:6px 4px;border-radius:10px;border:none;cursor:pointer;
  font-family:'Nunito',sans-serif;font-weight:800;font-size:11px;
  transition:.15s;color:#fff;opacity:.6;text-align:center
}
.cat-btn.active{opacity:1;transform:scale(1.04);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.cat-btn:hover{opacity:.85}

#block-palette{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
#block-palette::-webkit-scrollbar{width:5px}
#block-palette::-webkit-scrollbar-thumb{background:#2c3e50;border-radius:3px}

/* Search */
#search-wrap{padding:8px 8px 0}
#search-input{
  width:100%;padding:8px 12px;border-radius:12px;
  background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.1);
  color:#fff;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700
}
#search-input:focus{outline:none;border-color:rgba(255,255,255,.3)}
#search-input::placeholder{color:#666}

/* ── PALETTE BLOCK ── */
.pb{
  border-radius:10px;padding:10px 14px;cursor:grab;
  font-size:12px;font-weight:800;display:flex;align-items:center;
  gap:8px;transition:.12s;position:relative;color:#fff;
  user-select:none;touch-action:none;
  box-shadow:0 3px 10px rgba(0,0,0,.3)
}
.pb:hover{filter:brightness(1.15);transform:translateX(4px) scale(1.02)}
.pb:active{transform:scale(.95);cursor:grabbing}
.pb-icon{font-size:16px;flex-shrink:0;width:24px;text-align:center}
.pb-label{flex:1;line-height:1.2}
.pb-desc{font-size:10px;opacity:.7;font-weight:600;display:block;margin-top:1px}

/* ── WORKSPACE ── */
#ws-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#workspace{
  flex:1;position:relative;overflow:auto;
  background-image:radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1px);
  background-size:24px 24px;cursor:default
}
#ws-canvas{position:relative;min-width:3000px;min-height:2000px}
#ws-hint{
  position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;transition:opacity .4s
}
#ws-hint .h-icon{font-size:64px;margin-bottom:12px;opacity:.3}
#ws-hint .h-text{font-size:16px;color:#5a6a8a;font-weight:800}
#ws-hint .h-sub{font-size:12px;color:#3a4a6a;margin-top:6px}

/* ── OUTPUT ── */
#output{
  height:180px;background:#0a0a14;border-top:3px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;flex-shrink:0
}
#out-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.07)}
.out-tab{
  padding:8px 18px;border:none;background:transparent;
  color:var(--dim);font-weight:800;font-size:12px;cursor:pointer;
  border-bottom:3px solid transparent;transition:.15s;font-family:'Nunito',sans-serif
}
.out-tab.active{color:#fff;border-bottom-color:#e94560}
#out-body{flex:1;overflow-y:auto;padding:10px 14px}
#code-out{font-family:'Courier New',monospace;font-size:11.5px;line-height:1.8;white-space:pre;color:#8892b0}
.kw{color:#c792ea}.fn{color:#82aaff}.str{color:#c3e88d}.num{color:#f78c6c}
.cm{color:#4a5568}.op{color:#89ddff}.prop{color:#ffcb6b}

/* ── STACKED BLOCK SYSTEM ── */
.block-stack{
  position:absolute;cursor:move;user-select:none;touch-action:none;z-index:10
}
.block-stack.dragging-stack{z-index:1000;opacity:.92;filter:drop-shadow(0 12px 30px rgba(0,0,0,.8))}
.block-stack.snap-preview{filter:drop-shadow(0 0 12px var(--snap))}

/* Individual block in stack */
.blk{
  position:relative;min-width:220px;
  display:flex;flex-direction:column
}

/* SVG-style puzzle shape via clip-path */
.blk-body{
  display:flex;align-items:center;flex-wrap:wrap;
  padding:9px 14px;gap:6px;min-height:40px;
  position:relative;cursor:move;
}
/* Notch top (male - sticks up) */
.blk.has-top-notch .blk-body::before{
  content:'';position:absolute;top:-8px;left:28px;
  width:32px;height:9px;background:inherit;
  border-radius:6px 6px 0 0;z-index:1
}
/* Slot bottom (female) */
.blk.has-bottom-slot .blk-body::after{
  content:'';position:absolute;bottom:-8px;left:28px;
  width:32px;height:9px;background:inherit;
  border-radius:0 0 6px 6px;z-index:1
}
.blk-text{font-size:13px;font-weight:800;color:#fff;white-space:nowrap;pointer-events:none}
.blk-input{
  background:rgba(255,255,255,.18);border:none;border-radius:6px;
  padding:3px 8px;font-family:'Nunito',sans-serif;font-weight:700;
  font-size:12px;color:#fff;width:80px;min-width:60px;
  cursor:text;pointer-events:all
}
.blk-input:focus{outline:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.25)}
.blk-select{
  background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.2);
  border-radius:6px;padding:2px 6px;font-family:'Nunito',sans-serif;
  font-weight:700;font-size:11px;color:#fff;cursor:pointer;pointer-events:all
}
.blk-select option{background:#1a1a2e;color:#fff}
.blk-del{
  margin-left:auto;width:22px;height:22px;border-radius:50%;
  background:rgba(0,0,0,.3);border:none;color:rgba(255,255,255,.6);
  font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:.12s;pointer-events:all;flex-shrink:0
}
.blk-del:hover{background:#e74c3c;color:#fff}

/* Block connector line */
.blk+.blk{margin-top:-1px}
.blk:first-child .blk-body{border-radius:10px 10px 0 0}
.blk:last-child .blk-body{border-radius:0 0 10px 10px}
.blk:only-child .blk-body{border-radius:10px}
.blk:not(:first-child):not(:last-child) .blk-body{border-radius:0}

/* CAP block (hat - event) */
.blk.cap-block .blk-body{border-radius:20px 20px 0 0!important;padding-top:12px}
.blk.cap-block .blk-body::before{display:none!important}

/* END block */
.blk.end-block .blk-body{border-radius:0 0 20px 20px!important}
.blk.end-block .blk-body::after{display:none!important}

/* C-block (wrap / если) */
.blk.c-block{min-width:240px}
.blk.c-block .blk-body{padding-bottom:6px}
.c-inner{
  margin-left:30px;border-left:4px solid rgba(255,255,255,.2);
  min-height:32px;padding:4px 0;border-radius:0 0 0 6px
}

/* Snap highlight on workspace blocks */
.blk.snap-target{box-shadow:0 0 0 3px var(--snap),0 0 20px var(--snap)!important}

/* ── MOBILE ── */
#mob-fab{
  display:none;position:fixed;bottom:24px;left:24px;
  width:52px;height:52px;border-radius:50%;background:var(--cat-ui);
  border:none;color:#fff;font-size:24px;cursor:pointer;z-index:300;
  box-shadow:0 6px 24px rgba(233,69,96,.6);align-items:center;justify-content:center
}
#sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99
}
@media(max-width:680px){
  #sidebar{
    position:fixed;top:0;left:0;height:100dvh;z-index:150;
    transform:translateX(-100%);transition:.3s;width:270px
  }
  #sidebar.open{transform:translateX(0)}
  #sidebar-overlay.show{display:block}
  #mob-fab{display:flex}
  #topbar .logo{font-size:16px}
  .tbtn span{display:none}
  .tbtn{padding:7px 10px}
  #output{height:150px}
}
@media(max-width:380px){#topbar-btns .tbtn-undo{display:none}}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);
  background:#27ae60;color:#fff;padding:10px 24px;border-radius:24px;
  font-size:14px;font-weight:800;opacity:0;transition:.3s;z-index:9999;
  pointer-events:none;white-space:nowrap
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── BLOCK COUNT BADGE ── */
.stack-badge{
  position:absolute;top:-8px;right:-8px;background:#e94560;
  color:#fff;border-radius:10px;padding:2px 6px;font-size:10px;
  font-weight:800;pointer-events:none;z-index:5
}

/* ── CATEGORY COLORS ── */
.c-ui{background:linear-gradient(135deg,#e94560,#c0392b)}
.c-look{background:linear-gradient(135deg,#f5a623,#d68910)}
.c-sound{background:linear-gradient(135deg,#27ae60,#1e8449)}
.c-event{background:linear-gradient(135deg,#3498db,#2471a3)}
.c-control{background:linear-gradient(135deg,#9b59b6,#7d3c98)}
.c-vars{background:linear-gradient(135deg,#16a085,#0e6655)}
.c-math{background:linear-gradient(135deg,#e67e22,#ca6f1e)}
.c-text{background:linear-gradient(135deg,#1abc9c,#17a589)}
.c-roblox{background:linear-gradient(135deg,#e74c3c,#922b21)}
.c-player{background:linear-gradient(135deg,#2980b9,#1a5276)}
.c-loop{background:linear-gradient(135deg,#8e44ad,#6c3483)}
.c-logic{background:linear-gradient(135deg,#d4ac0d,#b7950b)}
.c-tween{background:linear-gradient(135deg,#7f8c8d,#616a6b)}
.c-gui{background:linear-gradient(135deg,#c0392b,#a93226)}
</style>
</head>
<body>
<!-- TOPBAR -->
<div id="topbar">
  <div class="logo">🧱 Roblox <span>Block Builder</span></div>
  <div id="topbar-btns">
    <div class="block-count" id="blk-counter">0 блоков</div>
    <button class="tbtn tbtn-undo" onclick="undo()">↩ <span>Отмена</span></button>
    <button class="tbtn tbtn-run" onclick="generateAndShow()">▶ <span>Генерить</span></button>
    <button class="tbtn tbtn-copy" onclick="copyCode()">⎘ <span>Копировать</span></button>
    <button class="tbtn tbtn-clear" onclick="clearAll()">🗑 <span>Очистить</span></button>
  </div>
</div>

<button id="mob-fab" onclick="toggleSidebar()">☰</button>
<div id="sidebar-overlay" onclick="toggleSidebar()"></div>

<div id="main">
<!-- SIDEBAR -->
<div id="sidebar">
  <div id="search-wrap">
    <input id="search-input" placeholder="🔍 Поиск блоков..." oninput="filterBlocks(this.value)">
  </div>
  <div id="cat-tabs"></div>
  <div id="block-palette"></div>
</div>

<!-- WORKSPACE -->
<div id="ws-area">
  <div id="workspace">
    <div id="ws-canvas">
      <div id="ws-hint">
        <div class="h-icon">🧱</div>
        <div class="h-text">Перетащи блок сюда!</div>
        <div class="h-sub">Блоки будут прилипать друг к другу 🔗</div>
      </div>
    </div>
  </div>
  <!-- OUTPUT -->
  <div id="output">
    <div id="out-tabs">
      <button class="out-tab active" onclick="switchTab('code',this)">📄 Lua Код</button>
      <button class="out-tab" onclick="switchTab('log',this)">📋 Лог</button>
      <button class="out-tab" onclick="switchTab('help',this)">❓ Помощь</button>
    </div>
    <div id="out-body">
      <div id="code-out"><span class="cm">-- 👋 Привет! Перетащи блоки сверху и нажми ▶ Генерить</span></div>
    </div>
  </div>
</div>
</div>
<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// BLOCK DEFINITIONS — 100+ блоков
// ═══════════════════════════════════════════════════════════
const CATS = [
  {id:'event', label:'⚡ События',    cls:'c-event'},
  {id:'ui',    label:'🖼 Интерфейс', cls:'c-ui'},
  {id:'look',  label:'🎨 Внешний вид',cls:'c-look'},
  {id:'control',label:'🔀 Управление',cls:'c-control'},
  {id:'loop',  label:'🔁 Циклы',     cls:'c-loop'},
  {id:'logic', label:'⚖ Логика',     cls:'c-logic'},
  {id:'vars',  label:'📦 Переменные',cls:'c-vars'},
  {id:'math',  label:'➕ Математика', cls:'c-math'},
  {id:'text',  label:'🔤 Текст',     cls:'c-text'},
  {id:'player',label:'👤 Игрок',     cls:'c-player'},
  {id:'roblox',label:'🎮 Roblox',    cls:'c-roblox'},
  {id:'tween', label:'✨ Анимация',  cls:'c-tween'},
];

// Поля: {k:ключ, l:метка, v:значение, t:'input'|'select', o:['вариант',...]}
const DEFS = [

  // ═══ СОБЫТИЯ ═══
  {cat:'event',id:'ev_start',cap:true, icon:'🚩',label:'Когда скрипт запустился',
   fields:[], end:false,
   code:()=>`-- Скрипт запустился!\n`},

  {cat:'event',id:'ev_btn_click',cap:true, icon:'👆',label:'Когда нажата кнопка',
   fields:[{k:'btn',l:'Кнопка',v:'MyButton'}],
   code:d=>`${d.btn}.MouseButton1Click:Connect(function()\n`},

  {cat:'event',id:'ev_btn_hover',cap:true, icon:'🖱',label:'Когда навели на',
   fields:[{k:'elem',l:'Объект',v:'MyButton'}],
   code:d=>`${d.elem}.MouseEnter:Connect(function()\n`},

  {cat:'event',id:'ev_mouse_leave',cap:true, icon:'👋',label:'Когда убрали мышь с',
   fields:[{k:'elem',l:'Объект',v:'MyButton'}],
   code:d=>`${d.elem}.MouseLeave:Connect(function()\n`},

  {cat:'event',id:'ev_key',cap:true, icon:'⌨',label:'Когда нажата клавиша',
   fields:[{k:'key',l:'Клавиша',v:'E',t:'select',o:['E','F','Q','R','G','H','Space','Return','LeftShift','LeftControl']}],
   code:d=>`game:GetService("UserInputService").InputBegan:Connect(function(inp,gpe)\n\tif gpe then return end\n\tif inp.KeyCode == Enum.KeyCode.${d.key} then\n`},

  {cat:'event',id:'ev_char_added',cap:true, icon:'🧍',label:'Когда появился персонаж',
   fields:[],
   code:()=>`game:GetService("Players").LocalPlayer.CharacterAdded:Connect(function(char)\n`},

  {cat:'event',id:'ev_touched',cap:true, icon:'💥',label:'Когда Part касается',
   fields:[{k:'part',l:'Part',v:'myPart'}],
   code:d=>`${d.part}.Touched:Connect(function(hit)\n`},

  {cat:'event',id:'ev_remote',cap:true, icon:'📡',label:'Когда получен RemoteEvent',
   fields:[{k:'ev',l:'Событие',v:'myEvent'}],
   code:d=>`game.ReplicatedStorage:WaitForChild("${d.ev}").OnClientEvent:Connect(function(data)\n`},

  {cat:'event',id:'ev_gui_focus',cap:true, icon:'✏',label:'Когда TextBox выбран',
   fields:[{k:'box',l:'TextBox',v:'MyBox'}],
   code:d=>`${d.box}.Focused:Connect(function()\n`},

  {cat:'event',id:'ev_textbox_enter',cap:true, icon:'✅',label:'Когда нажали Enter в поле',
   fields:[{k:'box',l:'TextBox',v:'MyBox'}],
   code:d=>`${d.box}.FocusLost:Connect(function(enterPressed)\n\tif enterPressed then\n`},

  // ═══ ИНТЕРФЕЙС — СОЗДАНИЕ ═══
  {cat:'ui',id:'ui_screengui',icon:'🖥',label:'Создать главный экран (ScreenGui)',
   fields:[{k:'name',l:'Имя',v:'MyGui'}],
   code:d=>`local ${d.name} = Instance.new("ScreenGui")\n${d.name}.Name = "${d.name}"\n${d.name}.ResetOnSpawn = false\n${d.name}.Parent = game:GetService("CoreGui")\n`},

  {cat:'ui',id:'ui_frame',icon:'▭',label:'Создать рамку (Frame)',
   fields:[{k:'name',l:'Имя',v:'Panel'},{k:'parent',l:'Родитель',v:'MyGui'},{k:'x',l:'X%',v:'10'},{k:'y',l:'Y%',v:'10'},{k:'w',l:'Ширина%',v:'30'},{k:'h',l:'Высота%',v:'40'}],
   code:d=>`local ${d.name} = Instance.new("Frame")\n${d.name}.Size = UDim2.new(${d.w/100},0,${d.h/100},0)\n${d.name}.Position = UDim2.new(${d.x/100},0,${d.y/100},0)\n${d.name}.Parent = ${d.parent}\n`},

  {cat:'ui',id:'ui_button',icon:'🔘',label:'Создать кнопку (Button)',
   fields:[{k:'name',l:'Имя',v:'MyBtn'},{k:'parent',l:'Родитель',v:'Panel'},{k:'text',l:'Текст',v:'Нажми!'},{k:'x',l:'X px',v:'10'},{k:'y',l:'Y px',v:'10'},{k:'w',l:'Ш px',v:'120'},{k:'h',l:'В px',v:'40'}],
   code:d=>`local ${d.name} = Instance.new("TextButton")\n${d.name}.Text = "${d.text}"\n${d.name}.Size = UDim2.new(0,${d.w},0,${d.h})\n${d.name}.Position = UDim2.new(0,${d.x},0,${d.y})\n${d.name}.Parent = ${d.parent}\n`},

  {cat:'ui',id:'ui_label',icon:'🏷',label:'Создать надпись (Label)',
   fields:[{k:'name',l:'Имя',v:'MyLabel'},{k:'parent',l:'Родитель',v:'Panel'},{k:'text',l:'Текст',v:'Привет!'}],
   code:d=>`local ${d.name} = Instance.new("TextLabel")\n${d.name}.Text = "${d.text}"\n${d.name}.Size = UDim2.new(1,0,0,30)\n${d.name}.BackgroundTransparency = 1\n${d.name}.Parent = ${d.parent}\n`},

  {cat:'ui',id:'ui_textbox',icon:'✏',label:'Создать поле ввода (TextBox)',
   fields:[{k:'name',l:'Имя',v:'MyBox'},{k:'parent',l:'Родитель',v:'Panel'},{k:'ph',l:'Подсказка',v:'Введи текст...'}],
   code:d=>`local ${d.name} = Instance.new("TextBox")\n${d.name}.PlaceholderText = "${d.ph}"\n${d.name}.Size = UDim2.new(1,-16,0,35)\n${d.name}.Parent = ${d.parent}\n`},

  {cat:'ui',id:'ui_image',icon:'🖼',label:'Создать картинку (ImageLabel)',
   fields:[{k:'name',l:'Имя',v:'MyImg'},{k:'parent',l:'Родитель',v:'Panel'},{k:'id',l:'Asset ID',v:'rbxassetid://0'}],
   code:d=>`local ${d.name} = Instance.new("ImageLabel")\n${d.name}.Image = "${d.id}"\n${d.name}.Size = UDim2.new(0,100,0,100)\n${d.name}.BackgroundTransparency = 1\n${d.name}.Parent = ${d.parent}\n`},

  {cat:'ui',id:'ui_imgbtn',icon:'🖼',label:'Создать кнопку-картинку (ImageButton)',

   code:d=>`local ${d.name} = Instance.new("ImageButton")\n${d.name}.Image = "${d.id}"\n${d.name}.Size = UDim2.new(0,80,0,80)\n${d.name}.BackgroundTransparency = 1\n${d.name}.Parent = ${d.parent}\n`},

function init() {
  renderCatTabs();
  renderPalette(activeCat);
}

function renderCatTabs() {
  const el = document.getElementById('cat-tabs');
  el.innerHTML = '';
  CATS.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'cat-btn' + (cat.id === activeCat ? ' active' : '');
    b.textContent = cat.label;
    const def = DEFS.find(d=>d.cat===cat.id);
    // find category class
    const d0 = DEFS.find(d=>d.cat===cat.id);
    const allCls = ['c-ui','c-look','c-sound','c-event','c-control','c-vars','c-math','c-text','c-roblox','c-player','c-loop','c-logic','c-tween','c-gui'];
    const match = allCls.find(c=>c==='c-'+cat.id)||'c-roblox';
    b.style.background = '';
    b.classList.add(match);
    b.onclick = () => { activeCat = cat.id; renderCatTabs(); renderPalette(cat.id); };
    el.appendChild(b);
  });
}

function renderPalette(catId, filter='') {
  const el = document.getElementById('block-palette');
  el.innerHTML = '';
  const items = DEFS.filter(d => {
    const catMatch = filter ? true : d.cat === catId;
    const textMatch = filter ? (d.label.toLowerCase().includes(filter.toLowerCase())) : true;
    return catMatch && textMatch;
  });
  const catObj = CATS.find(c=>c.id===catId);
  items.forEach(def => {
    const pb = document.createElement('div');
    pb.className = 'pb c-' + def.cat;
    pb.innerHTML = `<span class="pb-icon">${def.icon}</span><div class="pb-label">${def.label}</div>`;
    pb.title = 'Нажми или перетащи';
    pb.onclick = () => { addStackToWorkspace(def); closeMobile(); };
    makePaletteDrag(pb, def);
    el.appendChild(pb);
  });
  if (!items.length) {
    el.innerHTML = '<div style="color:#556;text-align:center;padding:20px;font-size:12px">Ничего не найдено 😔</div>';
  }
}

function filterBlocks(q) {
  renderPalette(activeCat, q);
}

// ═══════════════════════════════════════════════════════════
// STACK MANAGEMENT
// ═══════════════════════════════════════════════════════════
function addStackToWorkspace(def, x, y) {
  saveUndo();
  const ws = document.getElementById('workspace');
  const id = ++stackIdCounter;
  const bx = x !== undefined ? x : 80 + (id % 6) * 20;
  const by = y !== undefined ? y : 80 + (id % 9) * 20;

  const stack = {
    id, x:bx, y:by,
    blocks: [createBlockData(def)]
  };
  stacks.push(stack);
  renderStack(stack);
  updateHint();
  updateCounter();
  addLog(`+ ${def.label}`);
  showToast(`🧱 ${def.label}`);
}

function createBlockData(def) {
  const fields = {};
  (def.fields||[]).forEach(f => { fields[f.k] = f.v; });
  return { bid: ++blockIdCounter, defId: def.id, fields };
}

function renderStack(stack) {
  let el = document.getElementById('stack_'+stack.id);
  if (el) el.remove();

  el = document.createElement('div');
  el.className = 'block-stack';
  el.id = 'stack_' + stack.id;
  el.style.left = stack.x + 'px';
  el.style.top = stack.y + 'px';

  stack.blocks.forEach((bdata, idx) => {
    const def = DEFS.find(d=>d.id===bdata.defId);
    if (!def) return;
    const blk = buildBlockEl(bdata, def, idx, stack.blocks.length, stack.id);
    el.appendChild(blk);
  });

  if (stack.blocks.length > 1) {
    const badge = document.createElement('div');
    badge.className = 'stack-badge';
    badge.textContent = stack.blocks.length + ' блоков';
    el.appendChild(badge);
  }

  document.getElementById('ws-canvas').appendChild(el);
  makeStackDraggable(el, stack);
}

function buildBlockEl(bdata, def, idx, total, stackId) {
  const isFirst = idx === 0;
  const isLast = idx === total - 1;
  const isOnly = total === 1;

  const blk = document.createElement('div');
  blk.className = 'blk c-' + def.cat;
  if (def.cap) blk.classList.add('cap-block');
  if (def.end) blk.classList.add('end-block');
  if (!def.cap && !isFirst) blk.classList.add('has-top-notch');
  if (!def.end && !isLast) blk.classList.add('has-bottom-slot');

  // Body
  const body = document.createElement('div');
  body.className = 'blk-body c-' + def.cat;

  // Icon + label
  const iconSpan = document.createElement('span');
  iconSpan.className = 'blk-text';
  iconSpan.textContent = def.icon + ' ';
  body.appendChild(iconSpan);

  // Build inline with fields
  // Split label by field names for inline injection
  let label = def.label;
  const labelSpan = document.createElement('span');
  labelSpan.className = 'blk-text';
  labelSpan.textContent = label;
  body.appendChild(labelSpan);

  // Fields row
  if (def.fields && def.fields.length > 0) {
    const frow = document.createElement('div');
    frow.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px;width:100%';
    def.fields.forEach(f => {
      const lbl = document.createElement('span');
      lbl.style.cssText = 'color:rgba(255,255,255,.7);font-size:10px;white-space:nowrap';
      lbl.textContent = f.l + ':';
      frow.appendChild(lbl);

      if (f.t === 'select') {
        const sel = document.createElement('select');
        sel.className = 'blk-select';
        (f.o||[]).forEach(opt => {
          const o = document.createElement('option');
          o.value = opt; o.textContent = opt;
          if (opt === bdata.fields[f.k]) o.selected = true;
          sel.appendChild(o);
        });
        sel.onchange = (e) => { bdata.fields[f.k] = e.target.value; };
        frow.appendChild(sel);
      } else {
        const inp = document.createElement('input');
        inp.className = 'blk-input';
        inp.value = bdata.fields[f.k] || f.v;
        inp.style.width = Math.max(60, (bdata.fields[f.k]||f.v).length * 8 + 16) + 'px';
        inp.oninput = (e) => {
          bdata.fields[f.k] = e.target.value;
          e.target.style.width = Math.max(60, e.target.value.length * 8 + 16) + 'px';
        };
        inp.onmousedown = e => e.stopPropagation();
        inp.ontouchstart = e => e.stopPropagation();
        frow.appendChild(inp);
      }
    });
    body.appendChild(frow);
  }

  // Delete button
  const del = document.createElement('button');
  del.className = 'blk-del';
  del.textContent = '✕';
  del.onclick = (e) => { e.stopPropagation(); removeBlockFromStack(stackId, bdata.bid); };
  del.onmousedown = e => e.stopPropagation();
  body.appendChild(del);

  blk.appendChild(body);
  return blk;
}

function removeBlockFromStack(stackId, bid) {
  saveUndo();
  const stack = stacks.find(s=>s.id===stackId);
  if (!stack) return;
  stack.blocks = stack.blocks.filter(b=>b.bid!==bid);
  if (stack.blocks.length === 0) {
    stacks = stacks.filter(s=>s.id!==stackId);
    const el = document.getElementById('stack_'+stackId);
    if (el) el.remove();
  } else {
    renderStack(stack);
  }
  updateHint(); updateCounter();
  addLog('Блок удалён');
}

// ═══════════════════════════════════════════════════════════
// DRAG — PALETTE → WORKSPACE
// ═══════════════════════════════════════════════════════════
function makePaletteDrag(el, def) {
  let dragging = false, ghost = null;

  const start = (cx, cy) => {
    dragging = true;
    ghost = document.createElement('div');
    ghost.className = 'pb c-'+def.cat;
    ghost.style.cssText = `position:fixed;pointer-events:none;z-index:9999;width:200px;opacity:.8;transform:rotate(4deg);font-size:12px;padding:10px 14px;border-radius:10px;color:#fff;font-family:Nunito,sans-serif;font-weight:800`;
    ghost.innerHTML = `${def.icon} ${def.label}`;
    // apply background from class
    ghost.classList.add('c-'+def.cat);
    document.body.appendChild(ghost);
    move(cx, cy);
  };

  const move = (cx, cy) => {
    if (ghost) { ghost.style.left=(cx-100)+'px'; ghost.style.top=(cy-20)+'px'; }
  };

  const end = (cx, cy) => {
    if (ghost) { ghost.remove(); ghost=null; }
    if (!dragging) return;
    dragging = false;
    const ws = document.getElementById('workspace');
    const r = ws.getBoundingClientRect();
    if (cx>=r.left && cx<=r.right && cy>=r.top && cy<=r.bottom) {
      const x = cx - r.left + ws.scrollLeft - 110;
      const y = cy - r.top + ws.scrollTop - 20;
      // Check snap to existing stack
      const snapResult = findSnapTarget(x + 110, y + 20, null);
      if (snapResult) {
        saveUndo();
        snapResult.stack.blocks.splice(snapResult.idx, 0, createBlockData(def));
        renderStack(snapResult.stack);
        updateCounter();
        addLog(`+ ${def.label} → стек`);
        showToast(`🔗 Прикреплено!`);
      } else {
        addStackToWorkspace(def, Math.max(0,x), Math.max(0,y));
      }
    }
  };

  el.addEventListener('mousedown', e => { e.preventDefault(); start(e.clientX, e.clientY); });
  document.addEventListener('mousemove', e => { if(dragging) move(e.clientX, e.clientY); });
  document.addEventListener('mouseup', e => { if(dragging) end(e.clientX, e.clientY); });
  el.addEventListener('touchstart', e => { const t=e.touches[0]; start(t.clientX, t.clientY); }, {passive:true});
  document.addEventListener('touchmove', e => { if(dragging){ const t=e.touches[0]; move(t.clientX, t.clientY); e.preventDefault(); } }, {passive:false});
  document.addEventListener('touchend', e => { if(dragging){ const t=e.changedTouches[0]; end(t.clientX, t.clientY); } });
}

// ═══════════════════════════════════════════════════════════
// DRAG — STACK IN WORKSPACE
// ═══════════════════════════════════════════════════════════
function makeStackDraggable(el, stack) {
  let dragging = false;
  let startMx, startMy, startSx, startSy;
  let snapPreview = null;

  const getXY = (e) => {
    const t = e.touches ? e.touches[0] : e;
    return [t.clientX, t.clientY];
  };

  const onStart = (e) => {
    // Don't drag if clicking input/select/button
    if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.tagName==='BUTTON') return;
    e.preventDefault();
    dragging = true;
    const [cx, cy] = getXY(e);
    startMx = cx; startMy = cy;
    startSx = stack.x; startSy = stack.y;
    el.classList.add('dragging-stack');
    el.style.zIndex = 1000;
  };

  const onMove = (e) => {
    if (!dragging) return;
    e.preventDefault();
    const [cx, cy] = getXY(e);
    const ws = document.getElementById('workspace');
    const dx = cx - startMx, dy = cy - startMy;
    stack.x = Math.max(0, startSx + dx);
    stack.y = Math.max(0, startSy + dy);
    el.style.left = stack.x + 'px';
    el.style.top = stack.y + 'px';

    // Snap preview
    clearSnapHighlights();
    const snap = findSnapTarget(stack.x, stack.y, stack.id);
    if (snap) {
      el.classList.add('snap-preview');
    } else {
      el.classList.remove('snap-preview');
    }
  };

  const onEnd = (e) => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('dragging-stack','snap-preview');
    el.style.zIndex = 10;
    clearSnapHighlights();

    // Snap!
    const snap = findSnapTarget(stack.x, stack.y, stack.id);
    if (snap) {
      saveUndo();
      // Merge current stack INTO target
      const targetStack = snap.stack;
      const myBlocks = [...stack.blocks];
      if (snap.position === 'bottom') {
        targetStack.blocks.push(...myBlocks);
      } else {
        targetStack.blocks.unshift(...myBlocks);
      }
      // Remove current stack
      stacks = stacks.filter(s=>s.id!==stack.id);
      el.remove();
      renderStack(targetStack);
      updateCounter();
      showToast('🔗 Блоки соединены!');
      addLog('Стеки объединены');
    }
  };

  el.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
  el.addEventListener('touchstart', onStart, {passive:false});
  document.addEventListener('touchmove', onMove, {passive:false});
  document.addEventListener('touchend', onEnd);
}

function findSnapTarget(x, y, excludeId) {
  const ws = document.getElementById('workspace');
  for (const s of stacks) {
    if (s.id === excludeId) continue;
    const el = document.getElementById('stack_'+s.id);
    if (!el) continue;
    const h = el.offsetHeight;
    const w = el.offsetWidth;
    // Snap below target
    if (Math.abs(x - s.x) < SNAP_DIST + 40 && Math.abs(y - (s.y + h)) < SNAP_DIST) {
      return { stack: s, position: 'bottom', idx: s.blocks.length };
    }
    // Snap above target
    if (Math.abs(x - s.x) < SNAP_DIST + 40 && Math.abs(y - s.y) < SNAP_DIST) {
      return { stack: s, position: 'top', idx: 0 };
    }
  }
  return null;
}

function clearSnapHighlights() {
  document.querySelectorAll('.snap-preview,.snap-target').forEach(el => {
    el.classList.remove('snap-preview','snap-target');
  });
}

// ═══════════════════════════════════════════════════════════
// CODE GENERATION
// ═══════════════════════════════════════════════════════════
function generateCode() {
  const lines = ['-- 🧱 Generated by Roblox Block Builder', '-- ' + new Date().toLocaleString('ru'), ''];
  stacks.forEach(stack => {
    stack.blocks.forEach(b => {
      const def = DEFS.find(d=>d.id===b.defId);
      if (def) lines.push(def.code(b.fields));
    });
    lines.push('');
  });
  return lines.join('\n');
}

function highlightLua(code) {
  return code
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(--[^\n]*)/g,'<span class="cm">$1</span>')
    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')/g,'<span class="str">$1</span>')
    .replace(/\b(local|function|end|if|then|else|elseif|for|while|do|repeat|until|return|not|and|or|in|true|false|nil|break|continue)\b/g,'<span class="kw">$1</span>')
    .replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>')
    .replace(/\b([A-Za-z_][A-Za-z0-9_]*)\s*(?=\()/g,'<span class="fn">$1</span>');
}

function generateAndShow() {
  const code = generateCode();
  document.getElementById('code-out').innerHTML = highlightLua(code);
  switchTabById('code');
  showToast('✅ Код сгенерирован!');
  addLog('Код сгенерирован, ' + stacks.length + ' стеков');
}

function copyCode() {
  const code = generateCode();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(code).then(()=>showToast('✅ Скопировано!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value=code; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
    showToast('✅ Скопировано!');
  }
}

function clearAll() {
  if (stacks.length === 0) { showToast('⚠ Уже пусто!'); return; }
  saveUndo();
  document.querySelectorAll('.block-stack').forEach(e=>e.remove());
  stacks = [];
  updateHint(); updateCounter();
  document.getElementById('code-out').innerHTML = '<span class="cm">-- Добавь блоки и нажми ▶ Генерить</span>';
  showToast('🗑 Очищено!');
  addLog('Workspace очищен');
}

// ═══════════════════════════════════════════════════════════
// UNDO
// ═══════════════════════════════════════════════════════════
function saveUndo() {
  undoHistory.push(JSON.stringify({stacks, stackIdCounter, blockIdCounter}));
  if (undoHistory.length > 30) undoHistory.shift();
}

function undo() {
  if (!undoHistory.length) { showToast('⚠ Нечего отменять'); return; }
  const state = JSON.parse(undoHistory.pop());
  stacks = state.stacks;
  stackIdCounter = state.stackIdCounter;
  blockIdCounter = state.blockIdCounter;
  document.querySelectorAll('.block-stack').forEach(e=>e.remove());
  stacks.forEach(s=>renderStack(s));
  updateHint(); updateCounter();
  showToast('↩ Отменено');
}

// ═══════════════════════════════════════════════════════════
// TABS / LOG
// ═══════════════════════════════════════════════════════════
function switchTab(tab, btn) {
  activeTab = tab;
  document.querySelectorAll('.out-tab').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  else document.querySelectorAll('.out-tab').forEach((b,i)=>{
    if((i===0&&tab==='code')||(i===1&&tab==='log')||(i===2&&tab==='help')) b.classList.add('active');
  });
  switchTabById(tab);
}

function switchTabById(tab) {
  activeTab = tab;
  const el = document.getElementById('code-out');
  if (tab === 'log') {
    el.style.whiteSpace='normal';
    el.innerHTML = logs.slice(-60).map(l=>`<div style="color:#4a5568;font-size:11px;font-family:monospace">${l}</div>`).join('');
    el.scrollTop=el.scrollHeight;
  } else if (tab === 'help') {
    el.style.whiteSpace='normal';
    el.innerHTML = `<div style="font-size:12px;color:#8892b0;line-height:1.8">
      <b style="color:#fff;font-size:14px">🧱 Как пользоваться:</b><br>
      1️⃣ <b style="color:#e94560">Выбери категорию</b> в левом меню<br>
      2️⃣ <b style="color:#f5a623">Нажми или перетащи</b> блок в рабочую область<br>
      3️⃣ <b style="color:#27ae60">Заполни поля</b> в блоке (имена, значения)<br>
      4️⃣ <b style="color:#3498db">Соедини блоки</b> — перетащи один близко к другому!<br>
      5️⃣ <b style="color:#9b59b6">Нажми ▶ Генерить</b> — получи Lua-код!<br>
      6️⃣ <b style="color:#1abc9c">Копируй</b> в Roblox Studio и запускай!<br><br>
      <b style="color:#fff">💡 Подсказки:</b><br>
      🔗 Блоки <b>прилипают</b> если перетащить близко к другому стеку<br>
      ✕ Нажми <b>✕</b> на блоке чтобы удалить его<br>
      ↩ Кнопка <b>Отмена</b> отменяет последнее действие<br>
      ⚡ Начни с блока <b>"Когда нажата кнопка"</b> из раздела События!
    </div>`;
  } else {
    el.style.whiteSpace='pre';
  }
}

function addLog(msg) {
  const t = new Date().toLocaleTimeString('ru');
  logs.push(`[${t}] ${msg}`);
  if (activeTab==='log') switchTabById('log');
}

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function updateHint() {
  const hint = document.getElementById('ws-hint');
  hint.style.opacity = stacks.length === 0 ? '1' : '0';
}

function updateCounter() {
  const total = stacks.reduce((s,st)=>s+st.blocks.length,0);
  document.getElementById('blk-counter').textContent = total + ' блоков';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._to);
  t._to = setTimeout(()=>t.classList.remove('show'), 2000);
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}

function closeMobile() {
  if (window.innerWidth<=680) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('show');
  }
}

// Prevent workspace scroll while dragging on mobile
document.getElementById('workspace').addEventListener('touchmove', e=>{
  // allow scroll when not dragging
}, {passive:true});

init();
addLog('Block Builder v3.0 запущен 🚀');
</script>
